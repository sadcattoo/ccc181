{% extends "base.html" %}
{% block title %}Join the queue · YourApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h3 mb-3">Join the queue</h1>

    <form method="post" action="{{ url_for('join') }}" novalidate id="join-form">
    <div class="mb-3">
        <div class="d-grid gap-2">
            {% for s in services %}
            <input type="radio" class="btn-check" name="service_id"
                    id="service-{{ s.service_id }}" value="{{ s.service_id }}"
                    autocomplete="off"
                    {% if form.get('service_id') == s.service_id|string %}checked{% endif %}>

            <label class="btn {% if s.service_id == 1 %}btn-outline-primary btn-lg py-4{% else %}btn-outline-primary btn-sm py-2{% endif %}"
                    for="service-{{ s.service_id }}">{{ s.name }}</label>
            
            {% endfor %}
        </div>
        {% if errors and errors.service_id %}
            <div class="text-danger small mt-2">{{ errors.service_id }}</div>
        {% endif %}
    </div>

      <label>After tap: Your ticket number is shown in the dashboard</label>  

      <button type="submit" class="btn btn-primary w-100">Get a ticket</button>
    </form>
  </div>
</div>
{% endblock %}
