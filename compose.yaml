services:
  db:
    image: postgres:17
    container_name: merqueuery-db
    environment:
      POSTGRES_USER: merqueuery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: merqueuery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merqueuery -d merqueuery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: